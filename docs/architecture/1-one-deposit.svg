<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1160" width="1120" height="1160" role="img" aria-labelledby="diagram-1-title diagram-1-desc" class="architecture-svg"><title id="diagram-1-title">One deposit pays several suppliers.</title><desc id="diagram-1-desc">A $100 example: register and approve, issue dated units, settle two further invoices, mature, then atomically burn and withdraw. Backing is $100 throughout circulation while settlement reaches $300.</desc><style>text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#f1eee6;font-size:16px} .small{font-size:14px;fill:#a3b3bd}.label{font-size:13px;letter-spacing:1.2px;fill:#9cabbf}.heading{font-size:20px;font-weight:500}.money{fill:#69e6c0}.yield{fill:#e8b768}.control{fill:#9cabbf}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:15px}.box{fill:#0d1c27;stroke:#2a3e4c;stroke-width:1}.wire{fill:none;stroke:#566c7b;stroke-width:1.5}.guide{stroke:#273c4b;stroke-dasharray:4 7}.step{transition:opacity .5s ease,transform .5s ease}.step[data-visible="false"]{opacity:0;transform:translateY(6px)}a:hover text{text-decoration:underline}a:focus-visible{outline:2px solid #69e6c0}@media(prefers-reduced-motion:reduce){.step{transition:none!important;transform:none!important;opacity:1!important}}</style><defs><marker id="arrow-1-money" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#69e6c0"></path></marker><marker id="arrow-1-yield" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#e8b768"></path></marker><marker id="arrow-1-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9cabbf"></path></marker><marker id="arrow-1-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f1eee6"></path></marker><marker id="arrow-1-deficit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#c298a5"></path></marker></defs><rect width="1120" height="1160" rx="12" fill="#09151f"></rect><text x="32" y="35" class="label">CASCADE / 01</text><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/CascadeVault.sol" target="_blank" rel="noreferrer"><text x="32" y="65" class="control">CascadeVault · Solidity payment path</text></a><g><text x="100" y="113" text-anchor="middle">Creditor</text><line class="guide" x1="100" x2="100" y1="132" y2="1080"></line></g><g><text x="275" y="113" text-anchor="middle">Debtor (Apple)</text><line class="guide" x1="275" x2="275" y1="132" y2="1080"></line></g><g><text x="450" y="113" text-anchor="middle">CascadeVault</text><line class="guide" x1="450" x2="450" y1="132" y2="1080"></line></g><g><text x="625" y="113" text-anchor="middle">ERC-1155 ledger</text><line class="guide" x1="625" x2="625" y1="132" y2="1080"></line></g><g><text x="800" y="113" text-anchor="middle">Next Creditor</text><line class="guide" x1="800" x2="800" y1="132" y2="1080"></line></g><text x="925" y="113" class="label">BACKING / SETTLED</text><g class="step" data-step="1" data-visible="true"><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/CascadeVault.sol" target="_blank" rel="noreferrer"><rect x="38" y="151" width="840" height="56" rx="5" fill="#09151f"></rect><text x="48" y="174">01 · Register invoice · creditor authorizes D and M</text><text x="48" y="198" class="small">registerInvoice(Apple, $100, D, M) · M ≤ D</text><line x1="100" y1="221" x2="450" y2="221" stroke="#9cabbf" stroke-width="1.5" marker-end="url(#arrow-1-control)"></line><text x="925" y="190" class="money">$0 / $0</text></a></g><g class="step" data-step="2" data-visible="true"><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/CascadeVault.sol" target="_blank" rel="noreferrer"><rect x="38" y="253" width="840" height="56" rx="5" fill="#09151f"></rect><text x="48" y="276">02 · Approve USDC · spender is CascadeVault</text><text x="48" y="300" class="small">USDC.approve(vault, $100) · approval is on the USDC token</text><line x1="275" y1="323" x2="450" y2="323" stroke="#69e6c0" stroke-width="1.5" marker-end="url(#arrow-1-money)"></line><text x="925" y="292" class="money">$0 / $0</text></a></g><g class="step" data-step="3" data-visible="true"><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/CascadeVault.sol" target="_blank" rel="noreferrer"><rect x="38" y="355" width="840" height="56" rx="5" fill="#09151f"></rect><text x="48" y="378">03 · Deposit $100 USDC against the invoice</text><text x="48" y="402" class="small">issue(invoiceId, $100) · pulls backing into custody</text><line x1="275" y1="425" x2="450" y2="425" stroke="#69e6c0" stroke-width="1.5" marker-end="url(#arrow-1-money)"></line><text x="925" y="394" class="money">$100 / $0</text></a></g><g class="step" data-step="4" data-visible="true"><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/CascadeVault.sol" target="_blank" rel="noreferrer"><rect x="38" y="457" width="840" height="56" rx="5" fill="#09151f"></rect><text x="48" y="480">04 · Mint $100 dated M to the creditor</text><text x="48" y="504" class="small">Same issue transaction · Apple receives the original yield interval</text><line x1="450" y1="527" x2="625" y2="527" stroke="#69e6c0" stroke-width="1.5" marker-end="url(#arrow-1-money)"></line><text x="925" y="496" class="money">$100 / $100</text></a></g><g class="step" data-step="5" data-visible="true"><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/CascadeVault.sol" target="_blank" rel="noreferrer"><rect x="38" y="559" width="840" height="56" rx="5" fill="#09151f"></rect><text x="48" y="582">05 · Creditor pays its supplier · same $100 units</text><text x="48" y="606" class="small">pay via vault / ledger · guard: date ≤ new M ≤ new D</text><line x1="100" y1="629" x2="800" y2="629" stroke="#69e6c0" stroke-width="1.5" marker-end="url(#arrow-1-money)"></line><text x="925" y="598" class="money">$100 / $200</text></a></g><g class="step" data-step="6" data-visible="true"><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/CascadeVault.sol" target="_blank" rel="noreferrer"><rect x="38" y="661" width="840" height="56" rx="5" fill="#09151f"></rect><text x="48" y="684">06 · Next creditor pays a second onward invoice</text><text x="48" y="708" class="small">Ledger moves units to that supplier · same date guard</text><line x1="800" y1="731" x2="625" y2="731" stroke="#69e6c0" stroke-width="1.5" marker-end="url(#arrow-1-money)"></line><text x="925" y="700" class="money">$100 / $300</text></a></g><g class="step" data-step="7" data-visible="true"><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/CascadeVault.sol" target="_blank" rel="noreferrer"><rect x="38" y="763" width="840" height="56" rx="5" fill="#09151f"></rect><text x="48" y="786">07 · Maturity · existing units are interpreted as spot</text><text x="48" y="810" class="small">Solidity: id ≤ today() · UTC epoch day · no maintenance mint</text><line x1="450" y1="833" x2="625" y2="833" stroke="#9cabbf" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-1-control)"></line><text x="925" y="802" class="money">$100 / $300</text></a></g><g class="step" data-step="8" data-visible="true"><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/CascadeVault.sol" target="_blank" rel="noreferrer"><rect x="38" y="865" width="840" height="56" rx="5" fill="#09151f"></rect><text x="48" y="888">08 · Final holder requests $100 withdrawal</text><text x="48" y="912" class="small">withdraw($100) · only mature balances can be consumed</text><line x1="800" y1="935" x2="450" y2="935" stroke="#69e6c0" stroke-width="1.5" marker-end="url(#arrow-1-money)"></line><text x="925" y="904" class="money">$100 / $300</text></a></g><g class="step" data-step="9" data-visible="true"><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/CascadeVault.sol" target="_blank" rel="noreferrer"><rect x="38" y="967" width="840" height="56" rx="5" fill="#09151f"></rect><text x="48" y="990">09 · Burn matching principal; send $100 USDC</text><text x="48" y="1014" class="small">One atomic withdrawal · principal and backing fall together</text><line x1="450" y1="1037" x2="625" y2="1037" stroke="#69e6c0" stroke-width="1.5" marker-end="url(#arrow-1-money)"></line><text x="925" y="1006" class="money">$0 / $300</text></a></g><text x="38" y="1118" class="money">$100 backing during circulation → $300 of invoices settled → $100 principal redeemed.</text><text x="38" y="1143" class="small">Onward arrows summarize pay() through the vault and ledger. Final holder occupies the next-creditor role.</text></svg>

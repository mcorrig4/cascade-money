<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1190" width="1120" height="1190" role="img" aria-labelledby="diagram-4-title diagram-4-desc" class="architecture-svg"><title id="diagram-4-title">Where earnings come from, and who controls them.</title><desc id="diagram-4-desc">Deployed CascadeVault custodies USDC; its immutable checkpoint owner funds the chosen index delta. The local CascadeVaultUSYC values MockUSYC shares using owner-set price; MockUSYC owner controls setPrice and mint. Buy is funded by USDC and sell requires available USDC. Real USYC integration awaits Circle allowlisting; Arc mainnet is planned after September 16.</desc><style>text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#f1eee6;font-size:16px} .small{font-size:14px;fill:#a3b3bd}.label{font-size:13px;letter-spacing:1.2px;fill:#9cabbf}.heading{font-size:20px;font-weight:500}.money{fill:#69e6c0}.yield{fill:#e8b768}.control{fill:#9cabbf}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:15px}.box{fill:#0d1c27;stroke:#2a3e4c;stroke-width:1}.wire{fill:none;stroke:#566c7b;stroke-width:1.5}.guide{stroke:#273c4b;stroke-dasharray:4 7}.step{transition:opacity .5s ease,transform .5s ease}.step[data-visible="false"]{opacity:0;transform:translateY(6px)}a:hover text{text-decoration:underline}a:focus-visible{outline:2px solid #69e6c0}@media(prefers-reduced-motion:reduce){.step{transition:none!important;transform:none!important;opacity:1!important}}</style><defs><marker id="arrow-4-money" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#69e6c0"></path></marker><marker id="arrow-4-yield" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#e8b768"></path></marker><marker id="arrow-4-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9cabbf"></path></marker><marker id="arrow-4-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f1eee6"></path></marker><marker id="arrow-4-deficit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#c298a5"></path></marker></defs><rect width="1120" height="1190" rx="12" fill="#09151f"></rect><text x="32" y="35" class="label">CASCADE / 04</text><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/CascadeVaultUSYC.sol" target="_blank" rel="noreferrer"><text x="32" y="65" class="control">Arc testnet · deployed USDC vault / local USYC variant</text></a><g class="step" data-step="1" data-visible="true"><text x="32" y="116" class="money">ARC TESTNET · VERIFIED USDC VAULT</text><text x="590" y="116" class="yield">LOCAL VARIANT · MOCK USYC ACCOUNTING</text><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/CascadeVault.sol" target="_blank" rel="noreferrer"><g><rect class="box" x="32" y="140" width="498" height="112" rx="8"></rect><rect x="32" y="156" width="3" height="22" fill="#9cabbf"></rect><text x="50" y="174" class="heading" style="fill:#9cabbf">Checkpoint owner · privileged</text><text x="50" y="206">owner chooses indexDelta and calls checkpoint(delta).</text><text x="50" y="231">Owner approves and supplies USDC for accrued yield.</text></g></a><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/mocks/MockUSYC.sol" target="_blank" rel="noreferrer"><g><rect class="box" x="590" y="140" width="498" height="112" rx="8"></rect><rect x="590" y="156" width="3" height="22" fill="#9cabbf"></rect><text x="608" y="174" class="heading" style="fill:#9cabbf">MockUSYC.owner · privileged</text><text x="608" y="206">setPrice(value) controls valuation · scale 1e18.</text><text x="608" y="231">mint(to, shares) is owner-only; buy() is USDC-funded.</text></g></a><line x1="281" y1="252" x2="281" y2="320" stroke="#9cabbf" stroke-width="1.5" marker-end="url(#arrow-4-control)"></line><text x="298" y="291" class="small">Fund then publish daily index</text><line x1="839" y1="252" x2="839" y2="320" stroke="#9cabbf" stroke-width="1.5" marker-end="url(#arrow-4-control)"></line><text x="855" y="291" class="small">Price and share authority</text><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/CascadeVault.sol" target="_blank" rel="noreferrer"><g><rect class="box" x="32" y="325" width="498" height="162" rx="8"></rect><rect x="32" y="341" width="3" height="22" fill="#69e6c0"></rect><text x="50" y="359" class="heading" style="fill:#69e6c0">CascadeVault · USDC custody</text><text x="50" y="391">Backing = usdc.balanceOf(vault)</text><text x="50" y="416">Funded = ceil(activeNotional × delta / SCALE).</text><text x="50" y="441">accruedScaled rises by activeNotional × delta.</text><text x="50" y="466">Principal withdrawal returns USDC.</text></g></a><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/CascadeVaultUSYC.sol" target="_blank" rel="noreferrer"><g><rect class="box" x="590" y="325" width="498" height="162" rx="8"></rect><rect x="590" y="341" width="3" height="22" fill="#e8b768"></rect><text x="608" y="359" class="heading" style="fill:#e8b768">CascadeVaultUSYC · share custody</text><text x="608" y="391">Backing = asset.balanceOf(vault) × price / SCALE</text><text x="608" y="416">owner publishes consecutive daily checkpoint().</text><text x="608" y="441">Income excludes deposits and withdrawals.</text><text x="608" y="466">Principal withdrawal returns USYC shares.</text></g></a><line x1="839" y1="487" x2="839" y2="542" stroke="#e8b768" stroke-width="1.5" marker-end="url(#arrow-4-yield)"></line><text x="32" y="542" class="control">Immutable checkpoint owner on Arc testnet:</text><a href="https://testnet.arcscan.app/address/0x9C2069b5b510E548963E98474CA08F72E26Fe3f4" target="_blank" rel="noreferrer"><text x="32" y="570" class="mono">0x9C2069b5b510E548963E98474CA08F72E26Fe3f4</text></a><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/mocks/MockUSYC.sol" target="_blank" rel="noreferrer"><g><rect class="box" x="590" y="548" width="498" height="137" rx="8"></rect><rect x="590" y="564" width="3" height="22" fill="#9cabbf"></rect><text x="608" y="582" class="heading" style="fill:#9cabbf">MockUSYC · USDC redemption liquidity</text><text x="608" y="614">buy(): USDC in → shares minted at current price.</text><text x="608" y="639">sell(): shares burned → USDC from asset custody.</text><text x="608" y="664">Price changes do not add redemption cash.</text></g></a><a href="https://testnet.arcscan.app/address/0x4e7d5b438d38b93b811f7f847613100023d7dafe#code" target="_blank" rel="noreferrer"><g><rect class="box" x="32" y="641" width="498" height="137" rx="8"></rect><rect x="32" y="657" width="3" height="22" fill="#69e6c0"></rect><text x="50" y="675" class="heading" style="fill:#69e6c0">Arc testnet · verified</text><text x="50" y="707">Chain 5042002 · CascadeVault</text><text x="50" y="732">$10 principal settled $40 across four invoices.</text><text x="50" y="757">Open verified source and transaction receipts →</text></g></a><a href="https://github.com/mcorrig4/cascade-money/blob/main/docs/architecture/README.md" target="_blank" rel="noreferrer"><g><rect class="box" x="590" y="747" width="498" height="137" rx="8"></rect><rect x="590" y="763" width="3" height="22" fill="#e8b768"></rect><text x="608" y="781" class="heading" style="fill:#e8b768">Real USYC · allowlist-gated integration</text><text x="608" y="813">Real USYC after Circle allowlists the vault</text><text x="608" y="838">Testnet asset: MockUSYC · local execution trace.</text><text x="608" y="863">Real USYC follows Circle access and asset integration.</text></g></a><a href="https://github.com/mcorrig4/cascade-money/blob/main/docs/architecture/README.md" target="_blank" rel="noreferrer"><g><rect class="box" x="32" y="848" width="498" height="112" rx="8"></rect><rect x="32" y="864" width="3" height="22" fill="#9cabbf"></rect><text x="50" y="882" class="heading" style="fill:#9cabbf">Planned · Arc mainnet</text><text x="50" y="914">After September 16, 2026 launch</text><text x="50" y="939">Deployment and real-asset integration follow launch.</text></g></a><a href="https://testnet.arcscan.app/address/0x4e7d5b438d38b93b811f7f847613100023d7dafe#code" target="_blank" rel="noreferrer"><text x="32" y="1043" class="label">VERIFIED VAULT ADDRESS</text><text x="32" y="1074" class="mono">0x4E7D5b438d38b93b811F7f847613100023d7DafE</text></a><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/test/USYC.t.sol" target="_blank" rel="noreferrer"><text x="32" y="1144" class="small">USYC guard: Claim and Withdraw require zero deficit and sufficient USDC redemption liquidity at the mock asset.</text></a></g></svg>

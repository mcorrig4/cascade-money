<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1160" width="1120" height="1160" role="img" aria-labelledby="diagram-2-title diagram-2-desc" class="architecture-svg"><title id="diagram-2-title">Principal moves; yield ownership stays.</title><desc id="diagram-2-desc">$100 starts at T30. Transfer changes principal holder only. Extension burns T30 and mints T90; Apple retains days 1–30 and the extender gets 31–90. A participant pays $97 for principal only. Backward extension fails. Claims mint yield as spot separately from principal redemption.</desc><style>text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#f1eee6;font-size:16px} .small{font-size:14px;fill:#a3b3bd}.label{font-size:13px;letter-spacing:1.2px;fill:#9cabbf}.heading{font-size:20px;font-weight:500}.money{fill:#69e6c0}.yield{fill:#e8b768}.control{fill:#9cabbf}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:15px}.box{fill:#0d1c27;stroke:#2a3e4c;stroke-width:1}.wire{fill:none;stroke:#566c7b;stroke-width:1.5}.guide{stroke:#273c4b;stroke-dasharray:4 7}.step{transition:opacity .5s ease,transform .5s ease}.step[data-visible="false"]{opacity:0;transform:translateY(6px)}a:hover text{text-decoration:underline}a:focus-visible{outline:2px solid #69e6c0}@media(prefers-reduced-motion:reduce){.step{transition:none!important;transform:none!important;opacity:1!important}}</style><defs><marker id="arrow-2-money" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#69e6c0"></path></marker><marker id="arrow-2-yield" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#e8b768"></path></marker><marker id="arrow-2-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9cabbf"></path></marker><marker id="arrow-2-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f1eee6"></path></marker><marker id="arrow-2-deficit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#c298a5"></path></marker></defs><rect width="1120" height="1160" rx="12" fill="#09151f"></rect><text x="32" y="35" class="label">CASCADE / 02</text><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/CascadeVault.sol" target="_blank" rel="noreferrer"><text x="32" y="65" class="control">Solidity ledger · Python reference secondary market</text></a><text x="32" y="111" class="label">PRINCIPAL STATE MACHINE · $100 FACE VALUE · RELATIVE UTC DAYS</text><g class="step" data-step="1" data-visible="true"><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/CascadeVault.sol" target="_blank" rel="noreferrer"><g><rect class="box" x="32" y="140" width="240" height="112" rx="8"></rect><rect x="32" y="156" width="3" height="22" fill="#69e6c0"></rect><text x="50" y="174" class="heading" style="fill:#69e6c0">Day 0 · Creditor</text><text x="50" y="206">Issue $100 · T30</text><text x="50" y="231">Apple owns days 1–30</text></g></a><line x1="272" y1="192" x2="299" y2="192" stroke="#69e6c0" stroke-width="1.5" marker-end="url(#arrow-2-money)"></line></g><g class="step" data-step="2" data-visible="true"><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/CascadeVault.sol" target="_blank" rel="noreferrer"><g><rect class="box" x="304" y="140" width="240" height="112" rx="8"></rect><rect x="304" y="156" width="3" height="22" fill="#69e6c0"></rect><text x="322" y="174" class="heading" style="fill:#69e6c0">Day 10 · Extender</text><text x="322" y="206">Transfer · T30</text><text x="322" y="231">Yield ownership unchanged</text></g></a><line x1="544" y1="192" x2="571" y2="192" stroke="#69e6c0" stroke-width="1.5" marker-end="url(#arrow-2-money)"></line></g><g class="step" data-step="3" data-visible="true"><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/CascadeVault.sol" target="_blank" rel="noreferrer"><g><rect class="box" x="576" y="140" width="240" height="112" rx="8"></rect><rect x="576" y="156" width="3" height="22" fill="#e8b768"></rect><text x="594" y="174" class="heading" style="fill:#e8b768">Day 20 · Extender</text><text x="594" y="206">Burn T30 → mint T90</text><text x="594" y="231">Extender owns days 31–90</text></g></a><line x1="816" y1="192" x2="843" y2="192" stroke="#69e6c0" stroke-width="1.5" marker-end="url(#arrow-2-money)"></line></g><g class="step" data-step="4" data-visible="true"><a href="https://github.com/mcorrig4/cascade-money/blob/main/sim/core.py" target="_blank" rel="noreferrer"><g><rect class="box" x="848" y="140" width="240" height="112" rx="8"></rect><rect x="848" y="156" width="3" height="22" fill="#69e6c0"></rect><text x="866" y="174" class="heading" style="fill:#69e6c0">Day 25 · Buyer</text><text x="866" y="206">Sell $100 for $97 spot</text><text x="866" y="231">Buyer funds the purchase</text></g></a></g><g class="step" data-step="5" data-visible="true"><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/CascadeVault.sol" target="_blank" rel="noreferrer"><g><rect class="box" x="760" y="294" width="328" height="112" rx="8"></rect><rect x="760" y="310" width="3" height="22" fill="#9cabbf"></rect><text x="778" y="328" class="heading" style="fill:#9cabbf">Backward extension rejected</text><text x="778" y="360">Day 26 · T90 → T30</text><text x="778" y="385">InvalidDate · state unchanged</text></g></a><line x1="944" y1="252" x2="944" y2="292" stroke="#9cabbf" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-2-control)"></line></g><g class="step" data-step="4" data-visible="true"><a href="https://github.com/mcorrig4/cascade-money/blob/main/sim/core.py" target="_blank" rel="noreferrer"><text x="32" y="328" class="control">PYTHON REFERENCE · PARTICIPANT-FUNDED SECONDARY PURCHASE</text><text x="32" y="358">Buyer → extender: $97 of buyer-owned spot</text><text x="32" y="385">Extender → buyer: $100 dated T90 · buyer earns the $3 discount</text><text x="32" y="412" class="yield">Both existing entitlements stay with their beneficiaries.</text></a></g><text x="32" y="470" class="label">YIELD ENTITLEMENTS · NON-OVERLAPPING INCLUSIVE INTERVALS</text><line x1="340" x2="1060" y1="513" y2="513" class="wire"></line><g><line x1="340" x2="340" y1="505" y2="650" class="guide"></line><text x="340" y="538" text-anchor="middle" class="small">1</text></g><g><line x1="572" x2="572" y1="505" y2="650" class="guide"></line><text x="572" y="538" text-anchor="middle" class="small">30</text></g><g><line x1="580" x2="580" y1="505" y2="650" class="guide"></line><text x="580" y="493" text-anchor="middle" class="small">31</text></g><g><line x1="812" x2="812" y1="505" y2="650" class="guide"></line><text x="812" y="538" text-anchor="middle" class="small">60</text></g><g><line x1="1052" x2="1052" y1="505" y2="650" class="guide"></line><text x="1052" y="538" text-anchor="middle" class="small">90</text></g><g class="step" data-step="1" data-visible="true"><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/CascadeVault.sol" target="_blank" rel="noreferrer"><text x="32" y="584">Apple · original beneficiary</text><rect x="340" y="559" width="238" height="37" rx="4" fill="#e8b768" fill-opacity=".13" stroke="#e8b768"></rect><text x="350" y="584" class="yield">Days 1–30 · $100</text></a></g><g class="step" data-step="3" data-visible="true"><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/CascadeVault.sol" target="_blank" rel="noreferrer"><text x="32" y="642">Extender · added interval</text><rect x="580" y="617" width="478" height="37" rx="4" fill="#e8b768" fill-opacity=".26" stroke="#e8b768"></rect><text x="590" y="642" class="yield">Days 31–90 · $100</text></a></g><text x="32" y="696" class="mono">value = amount × [ I(end) − I(start − 1) ] / SCALE</text><g class="step" data-step="6" data-visible="true"><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/CascadeVault.sol" target="_blank" rel="noreferrer"><g><rect class="box" x="32" y="735" width="504" height="137" rx="8"></rect><rect x="32" y="751" width="3" height="22" fill="#e8b768"></rect><text x="50" y="769" class="heading" style="fill:#e8b768">Claim · beneficiary collects yield</text><text x="50" y="801">Day 30: Apple claims after I(30) is published.</text><text x="50" y="826">Day 90: extender claims after I(90) is published.</text><text x="50" y="851">claim(id) → claimed = true → mint today-dated spot</text></g></a></g><g class="step" data-step="7" data-visible="true"><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/CascadeVault.sol" target="_blank" rel="noreferrer"><g><rect class="box" x="568" y="735" width="520" height="137" rx="8"></rect><rect x="568" y="751" width="3" height="22" fill="#69e6c0"></rect><text x="586" y="769" class="heading" style="fill:#69e6c0">Redemption · holder collects principal</text><text x="586" y="801">Day 90: buyer holds $100 interpreted as spot.</text><text x="586" y="826">withdraw($100) → burn matching mature units</text><text x="586" y="851">Vault sends $100 backing to the buyer.</text></g></a></g><g class="step" data-step="7" data-visible="true"><line x1="284" y1="872" x2="284" y2="925" stroke="#e8b768" stroke-width="1.5" marker-end="url(#arrow-2-yield)"></line><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/CascadeVault.sol" target="_blank" rel="noreferrer"><g><rect class="box" x="32" y="928" width="504" height="112" rx="8"></rect><rect x="32" y="944" width="3" height="22" fill="#e8b768"></rect><text x="50" y="962" class="heading" style="fill:#e8b768">Claimed spot can be withdrawn separately</text><text x="50" y="994">Claim does not redeem the buyer’s $100.</text><text x="50" y="1019">Beneficiaries may keep or withdraw their spot.</text></g></a></g><text x="568" y="972" class="control">Date labels are relative to issuance day 0.</text><text x="568" y="1000" class="control">Every operation on day d earns from d + 1.</text><text x="32" y="1125" class="small">Solidity: transfer / extend / claim / withdraw. Python reference: atomic participant-funded Sell.</text></svg>

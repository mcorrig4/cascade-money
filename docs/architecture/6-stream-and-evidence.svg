orker.ts" target="_blank" rel="noreferrer"><g><rect class="box" x="576" y="155" width="240" height="87" rx="8"></rect><rect x="576" y="171" width="3" height="22" fill="#9cabbf"></rect><text x="594" y="189" class="heading" style="fill:#9cabbf">Loader worker</text><text x="594" y="221">Parse → validate → index</text></g></a><line x1="816" y1="202" x2="843" y2="202" stroke="#9cabbf" stroke-width="1.5" marker-end="url(#arrow-6-control)"></line></g><g><a href="https://github.com/mcorrig4/cascade-money/blob/main/app/src/playback/engine.ts" target="_blank" rel="noreferrer"><g><rect class="box" x="848" y="155" width="240" height="112" rx="8"></rect><rect x="848" y="171" width="3" height="22" fill="#69e6c0"></rect><text x="866" y="189" class="heading" style="fill:#69e6c0">Playback engine</text><text x="866" y="221">Cursor → globe</text><text x="866" y="246">counters</text></g></a></g><a href="https://github.com/mcorrig4/cascade-money/blob/main/app/src/data/index.ts" target="_blank" rel="noreferrer"><text x="32" y="340">Worker index: days, invoices, payments, extensions, trades and checkpoints.</text><text x="32" y="370" class="money">Counters: Issue + Pay increase settled value. Only Issue increases committed capital.</text></a><line x1="32" x2="1088" y1="418" y2="418" stroke="#52647a" stroke-dasharray="5 8"></line><text x="32" y="468" class="label">EVIDENCE PATH · CONTRACT TRANSACTIONS · ARC TESTNET</text><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/deployments/testnet-demo-run.md" target="_blank" rel="noreferrer"><g><rect class="box" x="32" y="501" width="496" height="87" rx="8"></rect><rect x="32" y="517" width="3" height="22" fill="#9cabbf"></rect><text x="50" y="535" class="heading" style="fill:#9cabbf">Contract transactions</text><text x="50" y="567">Arc testnet · separate evidence</text></g></a><a href="https://testnet.arcscan.app/address/0x4e7d5b438d38b93b811f7f847613100023d7dafe#code" target="_blank" rel="noreferrer"><g><rect class="box" x="592" y="501" width="496" height="87" rx="8"></rect><rect x="592" y="517" width="3" height="22" fill="#9cabbf"></rect><text x="610" y="535" class="heading" style="fill:#9cabbf">Explorer receipts</text><text x="610" y="567">Verified source + mined results</text></g></a><line x1="528" y1="548" x2="587" y2="548" stroke="#9cabbf" stroke-width="1.5" marker-end="url(#arrow-6-control)"></line><a href="https://testnet.arcscan.app/address/0x4e7d5b438d38b93b811f7f847613100023d7dafe#code" target="_blank" rel="noreferrer"><text x="32" y="655" class="heading">Verified on Arc testnet · $10 principal → $40 settled invoices</text></a><a href="https://testnet.arcscan.app/tx/0xddb123f602e2f1fa4ada0f28e475c36d1b5af9c1b0c2bde64c75cbdf2b2ef6b6" target="_blank" rel="noreferrer"><text x="32" y="710" class="money">Issue · Apple → Samsung Display → receipt</text></a><a href="https://testnet.arcscan.app/tx/0xc6e86f75cbfecbfdf1bd0699384ef3a8a8bbd882b8969136d121f66a4bbfdcd9" target="_blank" rel="noreferrer"><text x="592" y="710" class="money">Pay · Samsung Display → Corning → receipt</text></a><a href="https://testnet.arcscan.app/tx/0x3fa20bb3082861f4eed5c1ada2e94e6b4edbbe9a2c0d53b556245d4ee2cd2047" target="_blank" rel="noreferrer"><text x="32" y="750" class="money">Pay · Corning → Silica supplier → receipt</text></a><a href="https://testnet.arcscan.app/tx/0xf79dd29e18d2d70e5c6c3382459105d2937e66e685df2fb47e589033463d891f" target="_blank" rel="noreferrer"><text x="592" y="750" class="yield">Extend · T90 → T120 → receipt</text></a><a href="https://testnet.arcscan.app/tx/0xb164443044cbc0be3b1acb6b8f004e25aa5407960f9a141f15f94fd8edce0369" target="_blank" rel="noreferrer"><text x="32" y="790" class="money">Pay · Silica supplier → Freight carrier → receipt</text></a><text x="32" y="852" class="control">The globe plays a recorded event stream. The contract is verified on Arc testnet.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1730" height="1200" viewBox="0 0 1730 1200" role="img" aria-labelledby="title desc">
<title id="title">Cascade: dated dollars on Arc</title>
<desc id="desc">USDC or USYC backing feeds the Cascade vault. Date mints share a ledger with per-date ERC-20 views and on-chain metadata. Forward extension assigns added yield intervals. Reference and local-test evidence feed the front end beside the independent discount window.</desc>

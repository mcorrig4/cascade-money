<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1000" width="1120" height="1000" role="img" aria-labelledby="diagram-3-title diagram-3-desc" class="architecture-svg"><title id="diagram-3-title">One balance ledger, several interfaces.</title><desc id="diagram-3-desc">CascadeVault storage uses inherited ERC-1155 balances, per-date supply, invoices and creditor nonces, independent entitlements, a daily index, start and stop schedules, accruedScaled liability and accountDates heaps. ERC-20 date views forward reads and transfers to this ledger; DateMetadata supplies presentation.</desc><style>text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#f1eee6;font-size:16px} .small{font-size:14px;fill:#a3b3bd}.label{font-size:13px;letter-spacing:1.2px;fill:#9cabbf}.heading{font-size:20px;font-weight:500}.money{fill:#69e6c0}.yield{fill:#e8b768}.control{fill:#9cabbf}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:15px}.box{fill:#0d1c27;stroke:#2a3e4c;stroke-width:1}.wire{fill:none;stroke:#566c7b;stroke-width:1.5}.guide{stroke:#273c4b;stroke-dasharray:4 7}.step{transition:opacity .5s ease,transform .5s ease}.step[data-visible="false"]{opacity:0;transform:translateY(6px)}a:hover text{text-decoration:underline}a:focus-visible{outline:2px solid #69e6c0}@media(prefers-reduced-motion:reduce){.step{transition:none!important;transform:none!important;opacity:1!important}}</style><defs><marker id="arrow-3-money" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#69e6c0"></path></marker><marker id="arrow-3-yield" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#e8b768"></path></marker><marker id="arrow-3-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9cabbf"></path></marker><marker id="arrow-3-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f1eee6"></path></marker><marker id="arrow-3-deficit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#c298a5"></path></marker></defs><rect width="1120" height="1000" rx="12" fill="#09151f"></rect><text x="32" y="35" class="label">CASCADE / 03</text><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/CascadeVault.sol" target="_blank" rel="noreferrer"><text x="32" y="65" class="control">CascadeVault · Solidity storage and interfaces</text></a><g class="step" data-step="1" data-visible="true"><rect x="20" y="95" width="1080" height="581" rx="10" fill="none" stroke="#69e6c0" stroke-opacity=".35"></rect><text x="38" y="127" class="money">CascadeVault : ERC1155 · field names from Solidity</text><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/CascadeVault.sol" target="_blank" rel="noreferrer"><rect x="38" y="153" width="334" height="217" rx="7" class="box"></rect><text x="54" y="185">ERC-1155 · principal</text><line x1="54" x2="356" y1="202" y2="202" class="wire"></line><text x="54" y="231" class="mono">_balances[id][account] (inherited)</text><text x="54" y="259" class="mono">supplyByDate[id]</text><text x="54" y="287" class="mono">totalSupply</text><text x="54" y="344" class="small">Mature IDs are spot; counted once.</text></a><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/CascadeVault.sol" target="_blank" rel="noreferrer"><rect x="393" y="153" width="334" height="217" rx="7" class="box"></rect><text x="409" y="185">invoices[bytes32] → Invoice</text><line x1="409" x2="711" y1="202" y2="202" class="wire"></line><text x="409" y="231" class="mono">creditor · debtor · amount</text><text x="409" y="259" class="mono">outstanding</text><text x="409" y="287" class="mono">dueDate (D) · acceptedMaturity (M)</text><text x="409" y="344" class="small">invoiceNonces[creditor] seeds each ID.</text></a><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/CascadeVault.sol" target="_blank" rel="noreferrer"><rect x="748" y="153" width="334" height="217" rx="7" class="box"></rect><text x="764" y="185">entitlements[id] → Entitlement</text><line x1="764" x2="1066" y1="202" y2="202" class="wire"></line><text x="764" y="231" class="mono">account · amount</text><text x="764" y="259" class="mono">start (S) · end (E) · claimed</text><text x="764" y="287" class="mono">entitlementCount</text><text x="764" y="344" class="small">Principal transfers leave these intact.</text></a><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/CascadeVault.sol" target="_blank" rel="noreferrer"><rect x="38" y="406" width="334" height="217" rx="7" class="box"></rect><text x="54" y="438">Daily accrual</text><line x1="54" x2="356" y1="455" y2="455" class="wire"></line><text x="54" y="484" class="mono">dailyIndex[day] → I(d)</text><text x="54" y="512" class="mono">lastCheckpoint · activeNotional</text><text x="54" y="540" class="mono">accruedScaled</text><text x="54" y="597" class="small">Aggregate unclaimed liability, scaled.</text></a><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/CascadeVault.sol" target="_blank" rel="noreferrer"><rect x="393" y="406" width="334" height="217" rx="7" class="box"></rect><text x="409" y="438">Interval scheduling</text><line x1="409" x2="711" y1="455" y2="455" class="wire"></line><text x="409" y="484" class="mono">starts[S] += amount</text><text x="409" y="512" class="mono">stops[E + 1] += amount</text><text x="409" y="540" class="mono">S…E are inclusive</text><text x="409" y="597" class="small">Update activeNotional at checkpoint.</text></a><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/libraries/AccountDates.sol" target="_blank" rel="noreferrer"><rect x="748" y="406" width="334" height="217" rx="7" class="box"></rect><text x="764" y="438">accountDates[account] → Heap</text><line x1="764" x2="1066" y1="455" y2="455" class="wire"></line><text x="764" y="484" class="mono">dates[] · position[date]</text><text x="764" y="512" class="mono">datesOf(account, offset, limit)</text><text x="764" y="540" class="mono">earliestDate(account)</text><text x="764" y="597" class="small">Index of IDs with nonzero balances.</text></a><line x1="180" y1="730" x2="180" y2="677" stroke="#69e6c0" stroke-width="1.5" marker-end="url(#arrow-3-money)"></line><text x="200" y="710" class="small">read / transferDate()</text><line x1="850" y1="677" x2="850" y2="730" stroke="#9cabbf" stroke-width="1.5" marker-end="url(#arrow-3-control)"></line><text x="875" y="710" class="small">uri(id)</text><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/DatedDollarERC20.sol" target="_blank" rel="noreferrer"><g><rect class="box" x="32" y="735" width="630" height="162" rx="8"></rect><rect x="32" y="751" width="3" height="22" fill="#69e6c0"></rect><text x="50" y="769" class="heading" style="fill:#69e6c0">DatedDollarERC20 · viewFor[date]</text><text x="50" y="801">balanceOf(account) → vault.balanceOf(account, date)</text><text x="50" y="826">totalSupply() → vault.supplyByDate(date)</text><text x="50" y="851">transfer / transferFrom → vault.transferDate</text><text x="50" y="876">allowance[owner][spender] is local to each date view</text></g></a><a href="https://github.com/mcorrig4/cascade-money/blob/main/contracts/src/DateMetadata.sol" target="_blank" rel="noreferrer"><g><rect class="box" x="690" y="735" width="398" height="137" rx="8"></rect><rect x="690" y="751" width="3" height="22" fill="#9cabbf"></rect><text x="708" y="769" class="heading" style="fill:#9cabbf">DateMetadata · presentation</text><text x="708" y="801">uri · isoDate · label · creationSymbol</text><text x="708" y="826">JSON + SVG · USD+N / USD spot</text><text x="708" y="851">metadata is immutable in the vault.</text></g></a><text x="32" y="973" class="money">One supply: ERC-20 views hold allowances and labels; principal lives in the ERC-1155 ledger.</text></g></svg>
